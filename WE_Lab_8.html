<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Gallery</title>
    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <h1>Huzaifa Ibrahim's Store</h1>
        <p>Explore our exclusive product collection</p>
    </header>

    <!-- Product Gallery Container -->
    <main class="product-gallery">
        <!-- Product Card 1 -->
        <div class="product-card">
            <img src="smart_watch.avif" alt="Product 1">
            <h3>Smart Watch</h3>
            <p class="price">$49.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product Card 2 -->
        <div class="product-card">
            <img src="wireless_headphone.webp" alt="Product 2">
            <h3>Wireless Headphones</h3>
            <p class="price">$89.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product Card 3 -->
        <div class="product-card">
            <img src="running_shoes.png" alt="Product 3">
            <h3>Running Shoes</h3>
            <p class="price">$59.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product Card 4 -->
        <div class="product-card">
            <img src="classic_backpack.webp" alt="Product 4">
            <h3>Classic Backpack</h3>
            <p class="price">$39.99</p>
            <button>Add to Cart</button>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="site-footer">
        <p>&copy; 2026 E-Commerce Store. All rights reserved.</p>
    </footer>

</body>
</html>
